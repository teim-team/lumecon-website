name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Workflow-level is read-only. `pages: write` and `id-token: write` are the
# highest-value credentials in this repo (they can publish arbitrary content
# to lumecon.ai), and at workflow level the build job received them too even
# though it only reads the tree and runs npm. They are granted to the deploy
# job alone, below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false keeps the job token out of .git/config,
      # where any later step (including an npm lifecycle script from a
      # compromised transitive dependency) could read it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PUBLIC_* values are inlined at build time. Without them the site
      # builds "login-only": Open Lumecon falls back to /login and the
      # auth/checkout forms degrade to the contact-email path. Set the
      # repository variables to activate the product handoff.
      - run: npm run build
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only job that publishes, and the only one holding the tokens to.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
