name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Workflow-level is read-only. `pages: write` and `id-token: write` are the
# highest-value credentials in this repo (they can publish arbitrary content
# to lumecon.ai), and at workflow level the build job received them too even
# though it only reads the tree and runs npm. They are granted to the deploy
# job alone, below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false keeps the job token out of .git/config,
      # where any later step (including an npm lifecycle script from a
      # compromised transitive dependency) could read it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PUBLIC_* values are inlined at build time. Without them the site
      # builds "login-only": Open Lumecon falls back to /login, the
      # auth/checkout forms degrade to the contact-email path, and the CSP
      # loses the API origin. None of that fails anything, so the workflow
      # went green and published a quietly degraded site.
      #
      # Resolved once, here, into the job environment, rather than each step
      # evaluating `vars.*` for itself. Two reasons. The origins are already
      # the documented values in AGENTS.md and are hardcoded in four sibling
      # workflows, so an unset repository variable should build the site the
      # rest of CI already tests -- not fail the deploy, which is what it did
      # from the moment the guard landed and is why nothing has published
      # since. And resolving once means the check, the build and the CSP sync
      # cannot be handed three different values; the failure this guards
      # against is precisely a value that reached one step and not another.
      #
      # A variable that is SET but malformed still fails the job: the fallback
      # covers "unset", never "wrong".
      - name: Resolve the public origins
        run: node scripts/check-public-origins.mjs --resolve >> "$GITHUB_ENV"
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      - name: Check the public origins are deployable
        run: node scripts/check-public-origins.mjs
      - run: npm run build
      # Derives _headers' connect-src from the same PUBLIC_API_URL the meta
      # CSP uses, then asserts dist really carries both origins rather than
      # the fallbacks. A variable that was set but never reached Astro looks
      # identical to one that was never set, in the only place it matters.
      - name: Sync the header CSP and verify the build
        run: node scripts/sync-headers-csp.mjs dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only job that publishes, and the only one holding the tokens to.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
