name: Smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        env:
          PUBLIC_APP_URL: https://app.lumecon.ai
          PUBLIC_API_URL: https://api.lumecon.ai
      # Chromium is the merge gate — deterministic here. WebKit runs too,
      # but headless WebKit is unreliable in this CI runner (intermittent
      # TLS-handshake failures loading external resources, plus layout /
      # timing quirks the d3-geo map and the reveal scripts trip on). Those
      # are environmental, not real regressions, and iOS Safari is covered
      # by hand-QA — so WebKit is informational (continue-on-error) rather
      # than a blocking check.
      - name: Smoke — Chromium (required)
        run: npx playwright test --project=chromium
      - name: Smoke — WebKit (informational)
        run: npx playwright test --project=webkit
        continue-on-error: true
      - name: Keep the published copy audit current
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/lumecon-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill $preview_pid' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          DOCS_BASE_URL=http://127.0.0.1:4321 npm run docs:copy
          git diff --exit-code -- docs/site-copy-and-architecture.md
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: |
            test-results/
            playwright-report/
            docs/site-copy-and-architecture.md
            /tmp/lumecon-preview.log
          retention-days: 7
