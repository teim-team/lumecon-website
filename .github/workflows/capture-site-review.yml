name: Capture desktop redesign review

on:
  push:
    branches:
      - claude/lumacon-design-polish-iphq03
    paths:
      - .github/workflows/capture-site-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and serve
        run: |
          npm run build
          npm exec astro preview -- --host 127.0.0.1 --port 4330 > /tmp/lumecon-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4330 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lumecon-preview.log
          exit 1

      - name: Capture complete desktop routes
        env:
          SHOT_BASE: http://127.0.0.1:4330
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdir } from 'node:fs/promises';

          const routes = [
            ['home', '/'],
            ['pricing', '/pricing'],
            ['methodology', '/methodology'],
            ['cedar', '/cedar'],
            ['naics', '/naics'],
            ['glossary', '/glossary'],
            ['login', '/login'],
            ['signup', '/signup'],
            ['choose-plan', '/choose-plan'],
            ['checkout', '/checkout?tier=sprout'],
            ['welcome', '/welcome'],
            ['film', '/film'],
            ['ai-and-data-use', '/ai-and-data-use'],
            ['accessibility', '/accessibility'],
            ['privacy', '/privacy'],
            ['terms', '/terms'],
            ['404', '/404.html'],
          ];

          const out = '/tmp/site-desktop-review';
          await mkdir(out, { recursive: true });
          const browser = await chromium.launch({ args: ['--no-sandbox'] });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 },
            colorScheme: 'light',
            reducedMotion: 'reduce',
          });

          await context.addInitScript(() => {
            try {
              localStorage.setItem('lumecon:consent:analytics', 'denied');
            } catch {}
          });

          for (const [name, route] of routes) {
            const page = await context.newPage();
            await page.goto(process.env.SHOT_BASE + route, { waitUntil: 'networkidle' });
            await page.evaluate(async () => {
              document.querySelectorAll('img').forEach((img) => {
                img.loading = 'eager';
              });
              await document.fonts.ready;

              const step = Math.max(Math.floor(window.innerHeight * 0.72), 500);
              for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                window.scrollTo(0, y);
                await new Promise((resolve) => setTimeout(resolve, 80));
              }

              await Promise.all(
                [...document.images].map(
                  (img) =>
                    img.complete ||
                    new Promise((resolve) => {
                      const done = () => resolve();
                      img.addEventListener('load', done, { once: true });
                      img.addEventListener('error', done, { once: true });
                      setTimeout(done, 5000);
                    }),
                ),
              );
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(300);
            await page.screenshot({
              path: `${out}/${name}--desktop-light.jpg`,
              type: 'jpeg',
              quality: 90,
              fullPage: true,
            });
            await page.close();
            console.log('captured', name);
          }

          await context.close();
          await browser.close();
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: lumecon-desktop-redesign
          path: /tmp/site-desktop-review/*.jpg
          if-no-files-found: error
          retention-days: 3
