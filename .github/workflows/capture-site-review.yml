name: Capture responsive site review

on:
  push:
    branches:
      - claude/lumacon-design-polish-iphq03
    paths:
      - .github/workflows/capture-site-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and serve
        run: |
          npm run build
          npm exec astro preview -- --host 127.0.0.1 --port 4330 > /tmp/lumecon-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4330 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lumecon-preview.log
          exit 1

      - name: Capture routes and audit horizontal overflow
        env:
          SHOT_BASE: http://127.0.0.1:4330
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdir, writeFile } from 'node:fs/promises';

          const routes = [
            ['home', '/'],
            ['pricing', '/pricing'],
            ['methodology', '/methodology'],
            ['cedar', '/cedar'],
            ['naics', '/naics'],
            ['glossary', '/glossary'],
            ['login', '/login'],
            ['signup', '/signup'],
            ['choose-plan', '/choose-plan'],
            ['checkout', '/checkout?tier=sprout'],
            ['welcome', '/welcome'],
            ['film', '/film'],
            ['ai-and-data-use', '/ai-and-data-use'],
            ['accessibility', '/accessibility'],
            ['privacy', '/privacy'],
            ['terms', '/terms'],
            ['404', '/404.html'],
          ];

          const captureProfiles = [
            { name: 'desktop-1440x900', width: 1440, height: 900 },
            { name: 'mobile-430x932', width: 430, height: 932 },
            { name: 'mobile-375x812', width: 375, height: 812 },
          ];

          const overflowProfiles = [
            { width: 1440, height: 900 },
            { width: 1024, height: 900 },
            { width: 768, height: 900 },
            { width: 430, height: 932 },
            { width: 375, height: 812 },
          ];

          const out = '/tmp/lumecon-site-review';
          await mkdir(out, { recursive: true });
          const browser = await chromium.launch({ args: ['--no-sandbox'] });

          const makeContext = (viewport) =>
            browser.newContext({
              viewport,
              colorScheme: 'light',
              reducedMotion: 'reduce',
              deviceScaleFactor: 1,
            });

          const preparePage = async (page, route) => {
            await page.goto(process.env.SHOT_BASE + route, {
              waitUntil: 'networkidle',
              timeout: 45_000,
            });
            await page.evaluate(async () => {
              document.querySelectorAll('img').forEach((img) => {
                img.loading = 'eager';
                img.decoding = 'sync';
              });
              await document.fonts.ready;

              const step = Math.max(Math.floor(window.innerHeight * 0.72), 420);
              for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                window.scrollTo({ top: y, behavior: 'instant' });
                await new Promise((resolve) => setTimeout(resolve, 70));
              }

              await Promise.all(
                [...document.images].map(
                  (img) =>
                    img.complete ||
                    new Promise((resolve) => {
                      const done = () => resolve();
                      img.addEventListener('load', done, { once: true });
                      img.addEventListener('error', done, { once: true });
                      setTimeout(done, 5000);
                    }),
                ),
              );
              window.scrollTo({ top: 0, behavior: 'instant' });
            });
            await page.waitForTimeout(250);
          };

          const installState = async (context) => {
            await context.addInitScript(() => {
              try {
                localStorage.setItem('lumecon:consent:analytics', 'denied');
              } catch {}
            });
          };

          for (const profile of captureProfiles) {
            const dir = `${out}/${profile.name}`;
            await mkdir(dir, { recursive: true });
            const context = await makeContext({
              width: profile.width,
              height: profile.height,
            });
            await installState(context);

            for (const [name, route] of routes) {
              const page = await context.newPage();
              await preparePage(page, route);
              await page.screenshot({
                path: `${dir}/${name}--light.jpg`,
                type: 'jpeg',
                quality: 90,
                fullPage: true,
              });
              await page.close();
              console.log('captured', profile.name, name);
            }

            await context.close();
          }

          const audit = {
            generatedAt: new Date().toISOString(),
            routes: routes.map(([name, route]) => ({ name, route })),
            profiles: overflowProfiles,
            results: [],
            failures: [],
          };

          for (const profile of overflowProfiles) {
            const context = await makeContext(profile);
            await installState(context);

            for (const [name, route] of routes) {
              const page = await context.newPage();
              await preparePage(page, route);
              const measurement = await page.evaluate(() => {
                const viewportWidth = document.documentElement.clientWidth;
                const scrollWidth = Math.max(
                  document.documentElement.scrollWidth,
                  document.body?.scrollWidth || 0,
                );
                return {
                  viewportWidth,
                  scrollWidth,
                  overflowPx: Math.max(0, scrollWidth - viewportWidth),
                };
              });
              const result = {
                name,
                route,
                width: profile.width,
                height: profile.height,
                ...measurement,
                passed: measurement.overflowPx <= 1,
              };
              audit.results.push(result);
              if (!result.passed) audit.failures.push(result);
              await page.close();
              console.log(
                'overflow',
                profile.width,
                name,
                result.passed ? 'ok' : `FAILED +${result.overflowPx}px`,
              );
            }

            await context.close();
          }

          await writeFile(
            `${out}/overflow-report.json`,
            JSON.stringify(audit, null, 2) + '\n',
            'utf8',
          );
          await browser.close();

          if (audit.failures.length) {
            const summary = audit.failures
              .map((item) => `${item.name}@${item.width}: +${item.overflowPx}px`)
              .join(', ');
            throw new Error(`Horizontal overflow detected: ${summary}`);
          }
          NODE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lumecon-responsive-site-review
          path: /tmp/lumecon-site-review
          if-no-files-found: error
          retention-days: 3
